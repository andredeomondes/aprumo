name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Sem chave de API: mede BM25 e regras locais, que são determinísticos.
      - name: Avaliação sem modelo (piso de qualidade)
        run: python -m aprumo_ai.evaluation --no-llm --min-f1 bm25+regras=0.80

  bff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bff/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
