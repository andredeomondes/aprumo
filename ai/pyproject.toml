[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aprumo-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "rank-bm25>=0.2.2",
  "snowballstemmer>=2.2",
  "numpy>=1.26",
  "anthropic>=1.0",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pypdf>=5"]

[tool.setuptools.packages.find]
include = ["aprumo_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
